name: CI

on:
  push:
    branches: [main, feat/local-first]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm ci
      # the desktop app has its own package (Electron); only its types are needed here, not the download
      - name: Install desktop app types
        run: npm ci
        working-directory: packages/desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npx tsc -p tsconfig.packages.json
      - run: npx vitest run packages
      - run: npm run cli:build
      - name: CLI starts
        run: node packages/cli/dist/argus.mjs version
      - name: "End-to-end test (free, with a fake agent and a fake model)"
        run: node packages/cli/e2e/run-e2e.mjs
