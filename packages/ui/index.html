<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArgusOps</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo" aria-hidden="true"></span><strong>ArgusOps</strong><span id="conn" class="conn" role="status"></span></div>
  <nav id="tabs" role="tablist">
    <button role="tab" data-tab="agents" aria-selected="true">Agents <span class="badge" id="b-agents" hidden></span></button>
    <button role="tab" data-tab="autopilot" aria-selected="false">Autopilot</button>
    <button role="tab" data-tab="usage" aria-selected="false">Usage</button>
    <button role="tab" data-tab="alerts" aria-selected="false">Alerts <span class="badge" id="b-alerts" hidden></span></button>
    <button role="tab" data-tab="routing" aria-selected="false">Models</button>
  </nav>
</header>
<main id="main"></main>
<footer>Everything stays on this computer. There is no ArgusOps server.</footer>
<script src="/app.js"></script>
</body>
</html>
